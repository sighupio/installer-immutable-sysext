# G2 (add-immutable-upgrade-gates): order keepalived after the sysext overlay that provides the keepalived
# binary. Shipped inside the keepalived sysext so the unit and its ordering version together, removing the
# theoretical cold-reboot race where keepalived could start before systemd-sysext.service merges the overlay.
# Verify at boot: `systemctl show keepalived.service -p After` must list systemd-sysext.service. If a live
# cold reboot shows this drop-in is not honored early enough, fall back to a Butane/Ignition declaration on
# the base filesystem (design D2 option B).
[Unit]
After=systemd-sysext.service
Wants=systemd-sysext.service
