# G2 (add-immutable-upgrade-gates): order etcd after the sysext overlay that provides /usr/bin/etcd.
# Shipped inside the etcd sysext so the unit and its ordering version together, removing the theoretical
# cold-reboot race where etcd could start before systemd-sysext.service merges the overlay. Verify at boot:
# `systemctl show etcd.service -p After` must list systemd-sysext.service. If a live cold reboot shows this
# drop-in is not honored early enough, fall back to a Butane/Ignition declaration on the base filesystem
# (design D2 option B).
[Unit]
After=systemd-sysext.service
Wants=systemd-sysext.service
